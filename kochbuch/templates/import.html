{% extends "base.html" %}

{% block content %}
<div class="recipe-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="margin: 0;">{{ t('import_recipe') }}</h1>
        <a href="{{ url_for('kochbuch.index') }}" class="btn">
            ← {{ t('back_to_db') }}
        </a>
    </div>

    <p style="color: var(--secondary-amber); margin-bottom: 2rem;">
        {{ t('upload_text') }}
    </p>

    <form action="{{ url_for('kochbuch.do_import') }}" method="POST" enctype="multipart/form-data" class="search-grid" style="display: block;">
        <div style="margin-bottom: 2rem;">
            <input type="file" name="xml_file" id="xml_file" accept=".xml" required
                   style="color: var(--text-color); background: var(--input-bg); padding: 10px; border: 1px dashed var(--border-color); width: 100%;">
        </div>

        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn-search">
                {{ t('import_button') }}
            </button>
            </div>
    </form>
</div>
{% endblock %}
