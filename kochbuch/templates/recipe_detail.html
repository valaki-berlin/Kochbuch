{% extends "base.html" %}

{% block content %}
<div class="recipe-card">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <h1 style="margin: 0;">{{ recipe.title }}</h1>
        
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-end;">
            <a href="{{ url_for('kochbuch.show_edit_form', id=recipe.recipe_id) }}" class="btn">
                {{ t('edit_button_text') }}
            </a>

            <form action="{{ url_for('kochbuch.delete_recipe', id=recipe.recipe_id) }}" method="POST" 
                  onsubmit="return confirm('{{ t('delete_confirm') }}');" style="margin: 0;">
                <button type="submit" class="btn-delete">
                    {{ t('delete_button') }}
                </button>
            </form>
        </div>
    </div>
    
    <div class="detail-image-container">
        {% if image_url %}
            <img src="{{ image_url }}" alt="{{ recipe.title }}" class="detail-image">
        {% else %}
            <img src="{{ url_for('static', filename='images/default.jpg') }}" alt="Default Image" class="detail-image">
        {% endif %}
    </div>
    
    <div style="margin-top: 2rem;">
        </div>

    <div style="margin-top: 2rem;">
        <a href="{{ url_for('kochbuch.index') }}" class="btn">{{ t('back_to_db') }}</a>
    </div>
</div>

{% endblock %}
