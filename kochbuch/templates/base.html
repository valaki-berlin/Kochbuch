<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ t('title') }}{% endblock %}</title>
    <style>
        :root {
            /* --- Farbschema (Retro Terminal) --- */
            --bg-color: #1c1f22;          /* Soft Charcoal */
            --panel-color: #2d3135;       /* Lighter Grey for cards */
            --text-color: #e6e6e6;        /* Off-white */
            --accent-color: #ffc107;      /* Helleres Amber (#ffc107 statt #ffb000) */
            --secondary-amber: #cc8e00;   /* Muted Amber */
            --border-color: #3e444a;      /* Subtle borders */
            --input-bg: #ffd54f;          /* Bright yellow for editing */
            --input-text: #1a1a1a;        /* Dark text for inputs */

            /* --- Schriftgrößen & Abstände (Global steuerbar) --- */
            --base-font-size: 16px;       /* Basis für das Dokument */
            --recipe-font-size: 1.2rem;  /* Größe für Zutaten & Anleitung */
            --recipe-line-height: 1.7;    /* Zeilenabstand für bessere Lesbarkeit */
            --header-font-size: 1.8rem;   /* Größe der Überschriften */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: var(--base-font-size);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
        }

        /* --- Gezielte Steuerung für Rezept-Details --- */
        
        /* Zutaten-Tabelle */
        #ingredients-section table td {
            font-size: var(--recipe-font-size);
            line-height: var(--recipe-line-height);
        }

        /* Zubereitungsschritte */
        #instructions-section p, 
        #instructions-section span {
            font-size: var(--recipe-font-size);
            line-height: var(--recipe-line-height);
        }

        /* --- Header & Navigation --- */
        header {
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 1rem;
        }

        h1 { color: var(--accent-color); font-size: var(--header-font-size); margin-top: 0; }
        h3 { color: var(--accent-color); margin-bottom: 1rem; }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- Formular Elemente --- */
        input, textarea, select {
            background-color: var(--input-bg) !important;
            color: var(--input-text) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 4px;
            padding: 8px;
            font-family: inherit;
            box-sizing: border-box;
            width: 100%;
        }

        /* --- Buttons --- */
        button, .btn {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            display: inline-block;
            font-size: 0.9rem;
            text-align: center;
        }

        button:hover, .btn:hover {
            background-color: var(--border-color);
            border-color: #8b949e;
        }

        .btn-delete, .btn-save-large {
            background-color: var(--accent-color);
            color: var(--bg-color); 
            font-weight: bold;
            border: none;
        }

        .btn-delete:hover, .btn-save-large:hover {
            background-color: var(--secondary-amber);
        }

        /* --- Layout Hilfen --- */
        .recipe-card {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 8px;
        }

        .recipe-content-split-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            margin-bottom: 2rem; 
        }

        /* Bilder-Container */
        .detail-image-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 1.5rem 0 2rem 0;
        }

        .detail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Spezielle Text-Klassen */
        .qty-val-plain {
            /* Früher Amber, jetzt Standardfarbe aus Variablen */
            color: var(--text-color);
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('kochbuch.index') }}" class="btn">{{ t('btn_kochbuch') }}</a></li>
            </ul>
        </nav>
        <h1>{% block header_title %}{{ t('title') }}{% endblock %}</h1>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <hr style="border-color: var(--border-color); opacity: 0.3;">
        <p><small>Terminal access: Raspberry Pi | SQLite 3 | Lab Status: Online</small></p>
    </footer>

    <script>
        /**
         * Fügt eine neue Zutatenzeile im Editor hinzu
         */
        function addIngredientRow() {
            const container = document.getElementById('ingredient-rows');
            const rows = container.querySelectorAll('.ingredient-edit-row');
            if (rows.length > 0) {
                const lastRow = rows[rows.length - 1];
                const newRow = lastRow.cloneNode(true);
                newRow.querySelectorAll('input').forEach(input => {
                    input.value = '';
                });
                container.appendChild(newRow);
            }
        }
    </script>
</body>
</html>
